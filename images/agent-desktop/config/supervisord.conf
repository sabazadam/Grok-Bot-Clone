[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/bin/sh -c "exec Xvfb :0 -screen 0 ${RESOLUTION}x24 -ac -nolisten tcp"
user=agent
priority=10
autorestart=true
stdout_logfile=/var/log/xvfb.log
redirect_stderr=true

[program:openbox]
command=/bin/sh -c "sleep 1 && exec openbox"
user=agent
environment=DISPLAY=":0",HOME="/home/agent",USER="agent"
priority=20
autorestart=true
stdout_logfile=/var/log/openbox.log
redirect_stderr=true

[program:tint2]
command=/bin/sh -c "sleep 2 && exec tint2"
user=agent
environment=DISPLAY=":0",HOME="/home/agent",USER="agent"
priority=30
autorestart=true
stdout_logfile=/var/log/tint2.log
redirect_stderr=true

[program:x11vnc]
command=/bin/sh -c "sleep 2 && exec x11vnc -display :0 -forever -shared -nopw -quiet -rfbport 5900"
user=agent
priority=40
autorestart=true
stdout_logfile=/var/log/x11vnc.log
redirect_stderr=true

[program:novnc]
command=/bin/sh -c "sleep 3 && exec websockify --web /usr/share/novnc ${NOVNC_PORT} localhost:5900"
user=agent
priority=50
autorestart=true
stdout_logfile=/var/log/novnc.log
redirect_stderr=true

[program:actuator]
command=python3 /opt/actuator/actuator.py
user=agent
environment=DISPLAY=":0",HOME="/home/agent",USER="agent"
priority=60
autorestart=true
stdout_logfile=/var/log/actuator.log
redirect_stderr=true
