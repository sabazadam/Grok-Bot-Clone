appId: com.grokbot.app
productName: GrokBot
copyright: GrokBot
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - renderer/**/*
  - package.json
# Bundle the built web UI so local mode always has it (the spawned server is pointed
# here via WEB_DIST). The Node server itself runs from your GrokBot install via system
# Node, so we don't bundle the server/native modules into the app.
extraResources:
  - from: ../web/dist
    to: web
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.png
  # Personal/unsigned build by default. To sign+notarize, set identity + notarize below
  # and provide Apple credentials (see README).
  identity: null
dmg:
  title: GrokBot ${version}
